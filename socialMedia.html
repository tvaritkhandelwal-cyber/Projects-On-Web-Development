<!doctype html>
<html>
    <head>
        <title>Social Media</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
            rel="stylesheet"
        />

        <link
            href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800;900&display=swap"
            rel="stylesheet"
        />
        <script>

        </script>
    </head>
    <body>
        <section>
            <div class="container">
                <div class="text-black">
                    <h5 class="section-subtitle">
                        Social Media
                    </h5>
                    <h1 class="m-heading">
                        Let's Be Friends
                    </h1>
                </div>
                <div class="row g-3 mt-4">
                    <div class="col-12 col-md-4">
                        <a href="https://www.linkedin.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="media-link"
                        >
                        <h3>LinkdIn</h3>
                        <i class="bi bi-linkedin"></i>
                        </a>
                    </div>
                </div>
                <div class="row g-3 mt-4">
                    <div class="col-12 col-md-4">
                        <a href="https://www.youtube.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="media-link"
                        >
                        <h3>Youtube</h3>
                        <i class="bi bi-youtube"></i>
                        </a>
                    </div>
                </div>
                <div class="row g-3 mt-4">
                    <div class="col-12 col-md-4">
                        <a href="mailto:yourname@example.com"
                        class="media-link"
                        >
                        <h3>Email</h3>
                        <i class="bi bi-envelope-fill"></i>
                        </a>
                    </div>
                </div>
            </div>
        </section>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
    </body>
</html>
